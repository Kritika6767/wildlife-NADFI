<!DOCTYPE html>
<html lang="en">
<head>
<style>
   /* ==========================================
   1. DEFAULT / DESKTOP STYLES
   (Applies on computers and laptops)
   ========================================== */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: #333333;
  background-color: #ffffff;
  font-size: 16px;
}

/* Desktop Horizontal Top Navigation */
nav {
  background-color: rgba(255, 255, 255, 0.9);
  padding: 12px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

nav a {
  text-decoration: none;
  color: #2e4d25;
  font-weight: bold;
  font-size: 14px;
}

.site-logo {
  height: 35px;
  width: auto;
  vertical-align: middle;
  border-radius: 5px;
}

/* Hide mobile drawer controls on desktop */
.mobile-header,
.side-nav,
.nav-toggle,
.sidebar-overlay {
  display: none;
}

.content {
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
}

/* ==========================================
   2. MOBILE / PHONE STYLES
   (Applies ONLY on phone screens <= 768px)
   ========================================== */
@media screen and (max-width: 768px), screen and (orientation: portrait) {

  /* Mobile Background & Increased Font Size */
  body {
    background-image: url('1000324286.jpg'); /* Your leafy background image */
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #f2f5ed;

    font-size: 18px; /* Larger font size for phone screens */
    line-height: 1.6;
  }

  /* Hide Desktop Nav Bar */
  nav {
    display: none;
  }

  /* Mobile Top Bar with Hamburger Button */
  .mobile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 15px;
    background-color: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(5px);
    position: sticky;
    top: 0;
    z-index: 99;
  }

  .hamburger-btn {
    display: inline-block;
    font-size: 24px;
    cursor: pointer;
    color: #2e4d25;
    user-select: none;
  }

  .nav-toggle {
    display: none;
  }

  /* Slide-out Side Drawer Navigation */
  .side-nav {
    display: flex;
    position: fixed;
    top: 0;
    left: -260px; /* Off-screen until toggled */
    width: 250px;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.95);
    box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
    flex-direction: column;
    padding-top: 20px;
    transition: left 0.3s ease-in-out;
    z-index: 1001;
  }

  .side-nav a {
    padding: 15px 20px;
    text-decoration: none;
    color: #2e4d25;
    font-weight: bold;
    font-size: 18px;
    border-bottom: 1px solid #e5e5e5;
  }

  .close-btn {
    align-self: flex-end;
    padding: 10px 20px;
    font-size: 22px;
    cursor: pointer;
    color: #2e4d25;
  }

  /* Overlay Background Tint When Menu Opens */
  .sidebar-overlay {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
    z-index: 1000;
  }

  /* Trigger Drawer Menu Open */
  .nav-toggle:checked ~ .side-nav {
    left: 0;
  }

  .nav-toggle:checked ~ .sidebar-overlay {
    opacity: 1;
    visibility: visible;
  }
     }
   
</style>
</body>
</html>
