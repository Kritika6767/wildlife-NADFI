<!DOCTYPE html>
<html lang="en">
<head>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: #333333;
  background-color: #ffffff; 
}

/* Navigation Bar Layout */
nav {
  background-color: rgba(255, 255, 255, 0.9);
  padding: 12px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap; /* Helps links wrap neatly on narrow phone screens */
}

/* Navigation Link Styling - Reduced Font Size */
nav a {
  text-decoration: none;
  color: #2e4d25;
  font-weight: bold;
  font-size: 13px; /* Reduced navigation font size */
}

.site-logo {
  height: 32px; /* Proportionally resized logo to match smaller font */
  width: auto;
  vertical-align: middle;
  border-radius: 5px;
}

.content {
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
}

/* ==========================================
   MOBILE STYLES (PORTRAIT & LANDSCAPE)
   ========================================== */
/* Triggers on screens up to 1024px width OR mobile device orientation */
@media screen and (max-width: 1024px), screen and (orientation: portrait), screen and (orientation: landscape) and (max-height: 500px) {
  body {
    /* Mobile background image */
    background-image: url('Histo.png'); 

    /* Fills full phone screen in both portrait and landscape */
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    /* Fallback background color */
    background-color: #f2f5ed; 
  }

  /* Optional: Further reduce nav font size slightly on smaller portrait phone screens */
  nav a {
    font-size: 12px;
  }
}
</style>

</body>
</html>
